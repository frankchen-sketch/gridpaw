<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nonogram Demo — GridPaw</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4FWP61DJCC"></script>
<script>
  // Standalone page carries its own analytics (Pictomino pattern) — the Astro
  // parent page cannot see inside the iframe. window.gtag must be a function
  // expression, NOT a hoisted declaration (define:vars IIFE trap).
  // 口径铁律：只有 gridpaw.com / www.gridpaw.com 上报，localhost/预览域静默
  // （与 src/components/SEOHead.astro 同款 guard，本机 QA 流量曾污染生产 GA4）。
  var IS_PROD = /(^|\.)gridpaw\.com$/.test(location.hostname);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  if (IS_PROD) {
    window.gtag('js', new Date());
    window.gtag('config', 'G-4FWP61DJCC');
  }
</script>
<style>
  :root {
    --amber: #d97706;
    --amber-dark: #b45309;
    --cream: #fff8ef;
    --cream-2: #fdeed3;
    --ink: #3f2d1d;
    --line: #e7d4b8;
    --err: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px 12px 40px;
  }
  header { text-align: center; margin-bottom: 10px; }
  header h1 { font-size: 20px; color: var(--amber-dark); }
  header .sub { font-size: 12px; color: #8a6d4e; margin-top: 2px; }
  .topbar {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    margin: 10px 0 14px; flex-wrap: wrap;
    position: relative; z-index: 20;
  }
  .chip {
    background: var(--amber); color: #fff; font-weight: 700; font-size: 13px;
    border-radius: 999px; padding: 5px 14px;
  }
  .chip.tut { background: #0e9f6e; }
  button.btn {
    background: #fff; border: 2px solid var(--line); color: var(--ink);
    border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  button.btn:hover { border-color: var(--amber); color: var(--amber-dark); }
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
  .board {
    display: grid;
    background: var(--line);
    gap: 2px;
    border: 3px solid var(--amber-dark);
    border-radius: 10px;
    padding: 4px;
    touch-action: manipulation;
    width: max-content;
  }
  .board .corner { background: var(--cream-2); }
  .clue-col {
    background: var(--cream);
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; /* clue stack hugs the grid top edge */
    font-size: clamp(10px, calc(var(--cell) * .40), 14px);
    font-weight: 800; color: var(--amber-dark); line-height: 1.04;
    padding: 0 2px 2px 2px; cursor: pointer;
  }
  .clue-row {
    background: var(--cream);
    display: flex; align-items: center; justify-content: flex-end;
    font-size: clamp(10px, calc(var(--cell) * .44), 15px);
    font-weight: 800; color: var(--amber-dark); line-height: 1;
    padding: 0 5px; white-space: nowrap; cursor: pointer;
  }
  .cell {
    background: #fff;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
    transition: background-color .15s ease;
  }
  .cell .mark { font-size: calc(var(--cell) * .58); font-weight: 900; color: var(--ink); line-height: 1; }
  .cell.filled { background: var(--amber); }
  .cell.err-flash { animation: shake 0.3s; background: #fee2e2; }
  .cell.err-flash .mark { color: var(--err); }
  .cell.clue-lit {
    box-shadow: inset 0 0 0 2px var(--amber);
    background: #fff3d6 !important;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .msg {
    min-height: 44px; max-width: 440px; text-align: center;
    font-size: 14px; line-height: 1.45; margin: 12px auto 4px;
    background: #fff; border: 2px dashed var(--line); border-radius: 10px;
    padding: 8px 12px;
    word-wrap: break-word; overflow-wrap: break-word;
  }
  .msg.tut { border-color: #0e9f6e; background: #ecfdf5; }
  .msg.err { border-color: var(--err); color: var(--err); }
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(63, 45, 29, 0.55);
    align-items: center; justify-content: center; z-index: 600;
  }
  .overlay.show { display: flex; }
  .card {
    background: var(--cream); border-radius: 16px; padding: 22px 26px;
    text-align: center; border: 3px solid var(--amber);
    max-width: 360px;
  }
  .card .cat { font-size: 44px; }
  .card .cat img { width: 48px; height: 48px; border-radius: 12px; display: block; margin: 0 auto; }
  .card h2 { color: var(--amber-dark); margin: 6px 0 2px; font-size: 20px; }
  .card .name { font-size: 14px; font-weight: 700; color: var(--amber-dark); margin: 4px 0 8px; }
  .card p { font-size: 14px; margin-bottom: 10px; }
  #winPix {
    display: inline-grid; gap: 2px; background: var(--line); padding: 4px;
    border-radius: 8px; border: 2px solid var(--amber-dark); margin: 0 0 10px;
  }
  #winPix .px { width: 17px; height: 17px; background: #fff; }
  #winPix .px.on { transition: background-color .1s linear; transition-delay: var(--d); }
  #winPix.lit .px.on { background: var(--amber); }
  .card button {
    background: var(--amber); color: #fff; border: none; border-radius: 10px;
    padding: 10px 22px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .hint-badge {
    display: inline-block; min-width: 16px; height: 16px; line-height: 16px;
    border-radius: 8px; background: #fff; color: var(--amber-dark);
    font-size: 11px; font-weight: 900; text-align: center; margin-left: 2px;
    vertical-align: 1px;
  }
  .foot { margin-top: 14px; font-size: 11px; color: #b09a7f; }

  .win-share-row { display: flex; gap: .5rem; margin-top: .8rem; justify-content: center; flex-wrap: wrap; }
  .share-btn { padding: .5rem 1rem; border: none; border-radius: 10px; cursor: pointer; font-size: .85rem; font-weight: 600; font-family: inherit; transition: transform .1s; }
  .share-btn:active { transform: scale(.95); }
  .share-copy { background: var(--cream-2, #fdeed3); color: #8a5a2b; }
  .share-twitter { background: #1d9bf0; color: #fff; }
  .share-reddit { background: #FF4500; color: #fff; }
</style>
</head>
<body>
  <header>
    <h1><img src="/favicon.svg" alt="" style="width:24px;height:24px;border-radius:6px;vertical-align:-5px"> Nonogram</h1>
    <div class="sub">GridPaw demo — clues count runs, fill the picture</div>
  </header>

  <div class="topbar">
    <span class="chip" id="levelChip">Tutorial 1/4</span>
    <button class="btn" id="restartBtn">↺ Restart</button>
    <button class="btn" id="skipBtn" style="display:none">Skip tutorial »</button>
    <button class="btn" id="hintBtn">💡 Hint <span class="hint-badge" id="hintBadge">3</span></button>
    <button class="btn" id="jumpMedium">Practice Medium</button>
    <button class="btn" id="jumpHard">Practice Hard</button>
  </div>

  <div class="scroller"><div class="board" id="board"></div></div>
  <div class="msg tut" id="msg">Loading…</div>

  <div class="overlay" id="winOverlay">
    <div class="card">
      <div class="cat"><img src="/favicon.svg" alt="GridPaw"></div>
      <h2 id="winTitle">Solved!</h2>
      <p class="name" id="winName"></p>
      <div id="winPix"></div>
      <p id="winText"></p>
      <button id="nextBtn" style="display:none">Next level →</button>
      <div class="win-share-row">
        <button class="share-btn share-copy" id="share-copy">📋 Copy</button>
        <button class="share-btn share-twitter" id="share-twitter">𝕏 Share</button>
        <button class="share-btn share-reddit" id="share-reddit">👽 Reddit</button>
      </div>
    </div>
  </div>

  <div class="foot" id="foot">Demo build — engine self-tested via scripts/selftest-nonogram.mjs</div>

<script src="../nonogram-engine.js?v=1"></script>
<script>
(function () {
  'use strict';
// ── state ──
  var puzzle = null;
  var grid = [];          // player state, flat 0/1/2 (UNKNOWN/FILLED/EMPTY)
  var level = 0;          // 0-3 tutorials, then campaign, then endless daily
  var busy = false;
  var mistakes = 0;
  var hintsLeft = 3;
  var FREE_HINTS = 3;
  // dev builds (localhost/LAN) get unlimited hints for testing — mirrors the
  // admin/dev bypass pattern used by the other GridPaw games
  var isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '192.168.31.91';

  var boardEl = document.getElementById('board');
  var msgEl = document.getElementById('msg');
  var chipEl = document.getElementById('levelChip');
  var overlayEl = document.getElementById('winOverlay');

  function track(name, params) {
    if (!IS_PROD) return; // 非生产域静默，本机 QA 流量不进 GA4
    try {
      if (typeof window.gtag === 'function') window.gtag('event', name, params || {});
      else if (window.dataLayer) window.dataLayer.push(Object.assign({ event: name }, params || {}));
    } catch (e) { /* analytics never blocks gameplay */ }
  }

  // ── level plan: 4 tutorials → easy×3 → medium×4 → hard×4 → endless daily ──
  var CAMPAIGN = [];
  (function () {
    var i;
    for (i = 0; i < 3; i++) CAMPAIGN.push('easy');
    for (i = 0; i < 4; i++) CAMPAIGN.push('medium');
    for (i = 0; i < 4; i++) CAMPAIGN.push('hard');
  })();
  var CAMPAIGN_LEN = NONOGRAM_TUTORIALS.length + CAMPAIGN.length;

  function levelInfo(n) {
    if (n < NONOGRAM_TUTORIALS.length) {
      return { type: 'tutorial', def: NONOGRAM_TUTORIALS[n] };
    }
    var idx = n - NONOGRAM_TUTORIALS.length;
    if (idx < CAMPAIGN.length) {
      var key = CAMPAIGN[idx];
      return { type: 'gen', preset: NONOGRAM_DIFFICULTIES[key], key: key, num: idx + 1 };
    }
    // endless daily puzzles past the campaign: date-seeded, medium/hard alternate,
    // same board for every player on the same day
    var day = Math.floor(Date.now() / 86400000);
    var dk = (day + idx) % 2 === 0 ? 'medium' : 'hard';
    return { type: 'daily', preset: NONOGRAM_DIFFICULTIES[dk], key: dk, seed: day * 1000 + idx, num: idx + 1 };
  }

  function setMsg(text, cls) {
    msgEl.textContent = text;
    msgEl.className = 'msg' + (cls ? ' ' + cls : '');
  }

  function updateHintBadge() {
    var badge = document.getElementById('hintBadge');
    badge.textContent = isDev ? '∞' : hintsLeft;
    // ∞ must never render as "10" — keep it ≥13px with horizontal padding
    badge.style.fontSize = isDev ? '13px' : '11px';
    badge.style.padding = isDev ? '0 4px' : '0';
    badge.title = isDev ? 'Unlimited hints (dev mode)' : '';
  }

  // responsive sizing: cell size + clue gutter fit the viewport (mobile first)
  function layoutSize() {
    var cols = puzzle.cols, rows = puzzle.rows;
    var maxRC = 0, maxCC = 0, r, c;
    for (r = 0; r < rows; r++) {
      var l = puzzle.rowClues[r].join(' ').length;
      if (l > maxRC) maxRC = l;
    }
    for (c = 0; c < cols; c++) {
      var m = puzzle.colClues[c].length;
      if (m > maxCC) maxCC = m;
    }
    var avail = Math.min(window.innerWidth - 24, 720);
    if (avail < 240) avail = 240;
    var cluew = Math.max(34, Math.min(96, maxRC * 8 + 18));
    var clueh = Math.max(28, Math.min(90, maxCC * 10 + 14));
    var cell = Math.floor((avail - cluew - 8 - 2 * (cols + 1)) / cols);
    cell = Math.max(15, Math.min(44, cell));
    var need = cluew + cols * cell + 2 * (cols + 1) + 8;
    if (need > avail) cluew = Math.max(30, cluew - (need - avail));
    return { cell: cell, cluew: cluew, clueh: clueh };
  }

// ── board ──
  function mk(className) {
    var el = document.createElement('div');
    el.className = className;
    return el;
  }

  function render() {
    boardEl.innerHTML = '';
    var s = layoutSize();
    var i, r, c;
    boardEl.style.gridTemplateColumns = s.cluew + 'px' + (' repeat(' + puzzle.cols + ', ' + s.cell + 'px)');
    boardEl.style.gridTemplateRows = s.clueh + 'px' + (' repeat(' + puzzle.rows + ', ' + s.cell + 'px)');
    boardEl.style.setProperty('--cell', s.cell + 'px');

    // top-left corner (empty)
    var corner = mk('corner');
    corner.style.gridArea = '1 / 1';
    boardEl.appendChild(corner);

    // column clues (top edge, stack hugs the grid)
    for (c = 0; c < puzzle.cols; c++) {
      var cc = mk('clue-col');
      cc.style.gridArea = '1 / ' + (c + 2);
      for (var k = 0; k < puzzle.colClues[c].length; k++) {
        var n = document.createElement('span');
        n.textContent = puzzle.colClues[c][k];
        cc.appendChild(n);
      }
      cc.addEventListener('click', (function (ccol) {
        return function () { litColumn(ccol); };
      })(c));
      boardEl.appendChild(cc);
    }

    // row clues (left edge, right-aligned)
    for (r = 0; r < puzzle.rows; r++) {
      var rc = mk('clue-row');
      rc.style.gridArea = (r + 2) + ' / 1';
      rc.textContent = puzzle.rowClues[r].join(' ');
      rc.addEventListener('click', (function (rrow) {
        return function () { litRow(rrow); };
      })(r));
      boardEl.appendChild(rc);
    }

    // cells
    for (r = 0; r < puzzle.rows; r++) {
      for (c = 0; c < puzzle.cols; c++) {
        i = r * puzzle.cols + c;
        var cell = mk('cell');
        cell.dataset.idx = i;
        cell.style.gridArea = (r + 2) + ' / ' + (c + 2);
        if (grid[i] === CELL_FILLED) {
          cell.classList.add('filled');
        } else if (grid[i] === CELL_EMPTY) {
          var m = document.createElement('span');
          m.className = 'mark';
          m.textContent = '✕';
          cell.appendChild(m);
        }
        cell.addEventListener('click', onCellClick);
        boardEl.appendChild(cell);
      }
    }
  }

  function cellEl(i) {
    return boardEl.querySelector('[data-idx="' + i + '"]');
  }
  var litTimer = null;
  function clearLit() {
    var lit = boardEl.querySelectorAll('.clue-lit');
    for (var i = 0; i < lit.length; i++) lit[i].classList.remove('clue-lit');
    if (litTimer) { clearTimeout(litTimer); litTimer = null; }
  }
  function litRow(r) {
    clearLit();
    for (var c = 0; c < puzzle.cols; c++) {
      var el = cellEl(r * puzzle.cols + c);
      if (el) el.classList.add('clue-lit');
    }
    litTimer = setTimeout(clearLit, 2600);
  }
  function litColumn(c) {
    clearLit();
    for (var r = 0; r < puzzle.rows; r++) {
      var el = cellEl(r * puzzle.cols + c);
      if (el) el.classList.add('clue-lit');
    }
    litTimer = setTimeout(clearLit, 2600);
  }

  // ── input: tap cycles unknown → filled → ✕ → unknown ──
  function onCellClick(e) {
    if (busy || !puzzle) return;
    var i = parseInt(e.currentTarget.dataset.idx, 10);
    var next = (grid[i] + 1) % 3;
    if (next === CELL_FILLED && puzzle.solution[i] === 0) {
      // educational, never locks: wrong fill → red flash, auto-set to ✕, count it
      mistakes++;
      grid[i] = CELL_EMPTY;
      var el = e.currentTarget;
      var m = document.createElement('span');
      m.className = 'mark';
      m.textContent = '✕';
      el.appendChild(m);
      el.classList.add('err-flash');
      setMsg('That cell is empty in the picture — auto-marked ✕ (mistake №' + mistakes + ')', 'err');
      track('puzzle_mistake', { level: level });
      setTimeout(function () {
        el.classList.remove('err-flash');
        render();
        maybeWin();
      }, 620);
      return;
    }
    grid[i] = next;
    render();
    maybeWin();
  }

  function allKnown() {
    for (var i = 0; i < grid.length; i++) if (grid[i] === CELL_UNKNOWN) return false;
    return true;
  }

  // win = checkNonogramWin AND every cell is known (no blanks left)
  function maybeWin() {
    if (!allKnown()) return;
    if (checkNonogramWin(puzzle, grid)) onWin();
    else setMsg('Every cell is marked, but the picture doesn\u2019t match the clues — some ✕ cells are actually filled. Review and fix!', 'err');
  }

// ── hint (demo tier: direct reveal; 3 per level, unlimited in dev) ──
  function useHint() {
    if (busy || !puzzle) return;
    if (!isDev && hintsLeft <= 0) {
      setMsg('No hints left this level — solve it!', 'err');
      return;
    }
    if (!isDev) {
      hintsLeft--;
      updateHintBadge();
    }
    track('hint_used', { level: level });
    // target: prefer an unknown FILLED cell (real progress), else any unknown
    var target = -1, i;
    for (i = 0; i < grid.length; i++) {
      if (grid[i] !== CELL_UNKNOWN) continue;
      if (puzzle.solution[i] === 1) { target = i; break; }
    }
    if (target < 0) {
      for (i = 0; i < grid.length; i++) {
        if (grid[i] === CELL_UNKNOWN) { target = i; break; }
      }
    }
    if (target < 0) {
      setMsg('Nothing left to hint — every cell is already marked!');
      return;
    }
    grid[target] = puzzle.solution[target] === 1 ? CELL_FILLED : CELL_EMPTY;
    var gr = Math.floor(target / puzzle.cols) + 1;
    var gc = (target % puzzle.cols) + 1;
    setMsg('💡 Row ' + gr + ', col ' + gc + ' is ' + (grid[target] === CELL_FILLED ? 'filled — tap it ⬛.' : 'empty — tap it ✕.') +
      ' (' + (isDev ? 'unlimited hints' : hintsLeft + ' hints left') + ')');
    render();
    maybeWin();
  }

  // ── level loading ──
  function newPuzzle() {
    if (busy) return;
    busy = true;
    var info = levelInfo(level);
    grid = [];
    mistakes = 0;
    hintsLeft = FREE_HINTS;
    updateHintBadge();
    overlayEl.classList.remove('show');

    if (info.type === 'tutorial') {
      chipEl.textContent = 'Tutorial ' + (level + 1) + '/4 — ' + info.def.title;
      chipEl.className = 'chip tut';
      document.getElementById('skipBtn').style.display = '';
      setMsg(info.def.lesson, 'tut');
      // let the browser paint the lesson before blocking
      setTimeout(function () {
        puzzle = generateNonogramTutorial(info.def);
        grid = new Array(puzzle.rows * puzzle.cols).fill(CELL_UNKNOWN);
        busy = false;
        render();
      }, 30);
      return;
    }

    chipEl.className = 'chip';
    document.getElementById('skipBtn').style.display = 'none';
    var label = info.type === 'daily' ? 'Daily' : 'Level ' + info.num + '/11';
    chipEl.textContent = label + ' — ' + info.preset.label +
      (info.type === 'daily' ? ' ' : ' — ') + info.preset.rows + '×' + info.preset.cols;
    setMsg(info.type === 'daily' ? '📅 Daily puzzle — same board for everyone today.' : 'Generating a fresh puzzle…');
    setTimeout(function () {
      var p = null, tries = 0;
      while (!p && tries < 6) {
        p = generateNonogramPuzzle({
          rows: info.preset.rows,
          cols: info.preset.cols,
          density: info.preset.density,
          requireLineSolvable: info.preset.requireLineSolvable,
          seed: info.seed,
          timeBudgetMs: 8000,
          name: info.type === 'daily' ? 'Daily' : 'Level ' + info.num
        });
        tries++;
      }
      busy = false;
      if (!p) {
        setMsg('Could not generate a puzzle this time — tap ↺ Restart to try again.', 'err');
        return;
      }
      puzzle = p;
      grid = new Array(p.rows * p.cols).fill(CELL_UNKNOWN);
      setMsg(info.type === 'daily'
        ? '📅 Same board for everyone today — come back tomorrow for a fresh one.'
        : 'Paint the picture: tap a cell to fill ⬛, again for ✕, again to clear.');
      render();
    }, 30);
  }

  // ── win ──
  function onWin() {
    busy = true;
    var info = levelInfo(level);
    var title = document.getElementById('winTitle');
    var nameEl = document.getElementById('winName');
    var text = document.getElementById('winText');
    var nextBtnEl = document.getElementById('nextBtn');

    if (info.type === 'tutorial') {
      // skill pattern: brief pixel-art reveal, then auto-advance (no button)
      title.textContent = 'Solved!';
      nameEl.textContent = info.def.pattern.name;
      text.textContent = 'That\u2019s the picture. Next lesson…';
      nextBtnEl.style.display = 'none';
      showPixelReveal(puzzle);
      overlayEl.classList.add('show');
      setTimeout(function () {
        level++;
        busy = false;
        newPuzzle();
      }, 900);
      return;
    }

    if (info.type === 'gen') {
      var nextLevel = level + 1;
      try { localStorage.setItem('gridpaw-nonogram-progress', String(nextLevel)); } catch (e) { /* private mode */ }
      track('level_up', { level: level, difficulty: info.key });
    } else {
      track('daily_solved', { level: level });
    }

    title.textContent = info.type === 'daily' ? 'Daily solved!' : 'Solved!';
    nameEl.textContent = puzzle.name || '';
    text.textContent = info.type === 'daily'
      ? 'Same board, everyone, today. Come back tomorrow for a fresh one.'
      : (level + 1 >= CAMPAIGN_LEN
        ? 'Campaign complete! Endless daily puzzles unlocked.'
        : 'Every run paints the picture. Purrfect.');
    nextBtnEl.style.display = '';
    showPixelReveal(puzzle);
    overlayEl.classList.add('show');
  }

  // ── pixel-art reveal: the solved picture flips to amber in a ≤1s cascade ──
  function showPixelReveal(p) {
    var pix = document.getElementById('winPix');
    pix.innerHTML = '';
    var total = p.rows * p.cols;
    var ps = Math.max(10, Math.min(22, Math.floor(296 / p.cols)));
    pix.style.gridTemplateColumns = 'repeat(' + p.cols + ', ' + ps + 'px)';
    for (var i = 0; i < total; i++) {
      var d = document.createElement('div');
      d.className = 'px';
      if (p.solution[i] === 1) {
        d.classList.add('on');
        d.style.setProperty('--d', (i / total) * 0.94 + 's');
      }
      pix.appendChild(d);
    }
    void pix.offsetWidth; // force reflow so the cascade actually transitions
    pix.classList.add('lit');
  }

document.getElementById('nextBtn').addEventListener('click', function () {
    level++;
    busy = false;
    newPuzzle();
  });

  // ── share (Wordle-style victory loop; buttons live in the win overlay) ──
  function shareText() {
    var info = levelInfo(level);
    return info.type === 'daily'
      ? '\uD83C\uDFA8 GridPaw Daily Nonogram: today\u2019s cat is out of the bag \u2014 show me you\u2019re faster \u2192 gridpaw.com/nonogram/'
      : '\uD83C\uDFA8 Uncovered the hidden picture in GridPaw Nonogram Level ' + level + ' \u2014 zero wrong taps\u2026 mostly \uD83D\uDE0F Your turn \u2192 gridpaw.com/nonogram/';
  }
  document.getElementById('share-copy').addEventListener('click', function () {
    track('share_copy', { level: level });
    var self = this;
    navigator.clipboard.writeText(shareText()).then(function () {
      self.textContent = '✅ Copied';
      setTimeout(function () { self.textContent = '📋 Copy'; }, 1500);
    });
  });
  document.getElementById('share-twitter').addEventListener('click', function () {
    track('share_twitter', { level: level });
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText()), '_blank');
  });
  document.getElementById('share-reddit').addEventListener('click', function () {
    track('share_reddit', { level: level });
    window.open('https://www.reddit.com/r/gridpaw/submit?url=' + encodeURIComponent('https://gridpaw.com/nonogram/')
      + '&title=' + encodeURIComponent(shareText()), '_blank');
  });
  document.getElementById('restartBtn').addEventListener('click', function () {
    busy = false;
    newPuzzle();
  });
  document.getElementById('skipBtn').addEventListener('click', function () {
    if (level < NONOGRAM_TUTORIALS.length) {
      level = NONOGRAM_TUTORIALS.length;
      busy = false;
      newPuzzle();
    }
  });
  document.getElementById('hintBtn').addEventListener('click', useHint);
  document.getElementById('jumpMedium').addEventListener('click', function () {
    level = NONOGRAM_TUTORIALS.length + 3; // campaign slot 4 = first Medium
    busy = false;
    newPuzzle();
  });
  document.getElementById('jumpHard').addEventListener('click', function () {
    level = NONOGRAM_TUTORIALS.length + 7; // campaign slot 8 = first Hard
    busy = false;
    newPuzzle();
  });

  // ── test hooks (page is noindex; enables scripted playtest) ──
  window.__nonogramTest = {
    solutionAt: function (i) { return puzzle ? puzzle.solution[i] : null; },
    stateAt: function (i) { return puzzle ? grid[i] : null; },
    whiteCount: function () { return puzzle ? puzzle.rows * puzzle.cols : 0; },
    filledCount: function () {
      var n = 0;
      for (var i = 0; i < grid.length; i++) if (grid[i] === CELL_FILLED) n++;
      return n;
    },
    fillN: 8,
    fillDeducible: function () {
      if (!puzzle) return { applied: 0 };
      if (typeof lineSolve === 'function') {
        var res = lineSolve(puzzle, grid);
        if (res.failed) return { applied: 0, note: 'conflict' };
        var applied = 0;
        for (var i = 0; i < grid.length; i++) {
          if (grid[i] === CELL_UNKNOWN && res.states[i] !== CELL_UNKNOWN) {
            grid[i] = res.states[i];
            applied++;
          }
        }
        if (applied) setMsg('Deduced ' + applied + ' cell(s) via line solving.');
        render();
        maybeWin();
        return { applied: applied };
      }
      // fallback (engine without lineSolve export): fill the first N unknown cells
      var n = window.__nonogramTest.fillN || 8;
      var applied2 = 0;
      for (var j = 0; j < grid.length && applied2 < n; j++) {
        if (grid[j] === CELL_UNKNOWN) {
          grid[j] = puzzle.solution[j] === 1 ? CELL_FILLED : CELL_EMPTY;
          applied2++;
        }
      }
      if (applied2) setMsg('Auto-filled ' + applied2 + ' unknown cell(s) (fallback mode).');
      render();
      maybeWin();
      return { applied: applied2 };
    },
    solveBoard: function () {
      if (!puzzle) return;
      for (var i = 0; i < grid.length; i++) {
        grid[i] = puzzle.solution[i] === 1 ? CELL_FILLED : CELL_EMPTY;
      }
      render();
      maybeWin();
    },
    jumpMedium: function () {
      level = NONOGRAM_TUTORIALS.length + 3;
      busy = false;
      newPuzzle();
    },
    jumpHard: function () {
      level = NONOGRAM_TUTORIALS.length + 7;
      busy = false;
      newPuzzle();
    }
  };

  // ── resume campaign progress (never resume into the tutorial range) ──
  var savedProgress = 0;
  try { savedProgress = parseInt(localStorage.getItem('gridpaw-nonogram-progress') || '0', 10) || 0; } catch (e) { savedProgress = 0; }
  if (savedProgress > NONOGRAM_TUTORIALS.length && savedProgress < CAMPAIGN_LEN) level = savedProgress;

  // hide the demo footer inside the production embed
  if (location.search.indexOf('embed=1') >= 0) document.getElementById('foot').style.display = 'none';

  track('game_start', { level: level, trigger: (location.search.indexOf('embed=1') >= 0 ? 'embed' : 'direct') });
  newPuzzle();
})();
</script>
</body>
</html>
