<style>
  :root {
    --amber: #D97706; --amber-deep: #B45309; --cream: #FFF8F0; --card: #FFFFFF;
    --ink: #3D3226; --muted: #9E9590; --line: #E8DCCB;
    --good: #3E7C4F; --bad: #C0392B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', -apple-system, sans-serif; background: var(--cream); color: var(--ink); padding: 18px 14px 26px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  header .logo { width: 30px; height: 30px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; line-height: 1.1; flex: 1; }
  h1 .accent { color: var(--amber); }
  .case-chip { font-size: 12px; font-weight: 800; background: var(--amber); color: #fff; border-radius: 999px; padding: 3px 12px; letter-spacing: .04em; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .diff { display: flex; background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
  .diff button { border: 0; background: transparent; font: inherit; font-weight: 800; font-size: 12.5px; padding: 6px 14px; color: var(--muted); cursor: pointer; }
  .diff button.on { background: var(--amber); color: #fff; }
  .btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; font: inherit; font-weight: 800; font-size: 13px; padding: 7px 13px; cursor: pointer; color: var(--ink); }
  .btn:hover { border-color: var(--amber); color: var(--amber-deep); }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #fff; }
  .btn.primary:hover { background: var(--amber-deep); }
  .layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .clues { flex: 1 1 230px; min-width: 230px; }
  .clues h2 { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .clue { display: flex; gap: 9px; align-items: flex-start; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 11px; margin-bottom: 7px; font-size: 14.5px; line-height: 1.45; }
  .clue b { color: var(--amber-deep); }
  .clue .neg { color: var(--bad); }
  .clue img.cav { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); flex: 0 0 auto; margin-top: 1px; }
  .side { flex: 0 0 auto; width: 340px; max-width: 100%; }
  .board { display: grid; gap: 3px; background: #7A5C3E; border: 3px solid #7A5C3E; border-radius: 14px; padding: 3px; width: 100%; touch-action: manipulation; box-shadow: 0 6px 18px rgba(61,50,38,.18); }
  .cell { position: relative; aspect-ratio: 1; border-radius: 7px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; overflow: hidden; }

  .cell .prop { position: absolute; inset: 6%; z-index: 2; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(61,50,38,.25)); }
  .cell .fig { position: relative; z-index: 4; width: 72%; height: 72%; border-radius: 50%; border: 2.5px solid var(--amber); background: #fff; box-shadow: 0 2px 5px rgba(61,50,38,.35), 0 0 0 2px rgba(255,252,246,.9); pointer-events: none; }
  .cell.victim .fig { border-color:#9A8A78; filter: saturate(.85); }
  .cell .vbadge { position: absolute; z-index: 5; bottom: 1px; right: 1px; width: 13px; height: 13px; border-radius: 50%; background: #6B6B6B; color: #fff; font-size: 8.5px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .cell.sel-target { box-shadow: inset 0 0 0 2.5px rgba(217,119,6,.5); }
  .cell.placed-sel { box-shadow: inset 0 0 0 2.5px var(--amber); }
  .cell.hint-flash { animation: hintp 1.6s ease; }
  .cell.bad-flash { animation: badp .7s ease; }
  @keyframes hintp { 0%,70% { box-shadow: inset 0 0 0 3px var(--good); filter: brightness(1.12); } 100% {} }
  @keyframes badp { 0%,60% { box-shadow: inset 0 0 0 3px var(--bad); } 100% {} }
  .suspects { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .suss { position: relative; width: 56px; height: 60px; border: 2px solid var(--line); background: var(--card); border-radius: 12px 12px 10px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font: inherit; padding: 4px 2px 3px; }
  .suss::before, .suss::after { content: ""; position: absolute; top: -7px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 9px solid var(--line); }
  .suss::before { left: 6px; } .suss::after { right: 6px; }
  .suss img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #EFE3CF; object-fit: cover; }
  .suss .sn { font-size: 8.5px; font-weight: 800; color: var(--muted); margin-top: 1px; }
  .suss.sel { border-color: var(--amber); background: #FFF3E0; box-shadow: 0 3px 8px rgba(217,119,6,.25); }
  .suss.sel::before, .suss.sel::after { border-bottom-color: var(--amber); }
  .suss.done { opacity: .45; }
  .hintbox { margin-top: 10px; font-size: 13.5px; font-weight: 700; color: var(--good); min-height: 20px; }
  .hintbox.err { color: var(--bad); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .overlay { position: fixed; inset: 0; background: rgba(61,50,38,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .overlay.show { display: flex; }
  .win-card { background: var(--cream); border-radius: 20px; padding: 26px 24px 20px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.3); }

  .cta p { font-size: 13.5px; margin-bottom: 10px; color: var(--muted); font-weight: 700; }

<script>
const module = { exports: {} }; (function(){
'use strict';
/* ============================================================================
 * Murdoku-style logic puzzle engine spike (gridpaw tech validation)
 *
 * Rules modeled:
 *  - N×N grid partitioned into irregular named rooms; cells carry objects
 *    (0 plain, 1 blocker(not standable), 2 rug(standable), 3 table(standable))
 *  - People = (N-1) suspects (0..N-2) + victim V (N-1); each exactly one cell
 *  - Latin layer: all people in distinct rows AND distinct columns (N people
 *    over N rows/cols => each row and col holds exactly one person)
 *  - Victim rule: the room containing V holds exactly V+1 = 2 people (V + the
 *    single killer suspect); other rooms unbounded
 *  - Each suspect gives exactly ONE testimony; all testimonies are true
 *  - Testimony types:
 *      loc_in / loc_not_in        (room membership)
 *      on_rug / at_table / at_wall / in_corner   (object-spatial)
 *      same_room / only_me_and_x  (social)
 *      room_has_k / room_empty    (global room-count)
 *
 * Generation pipeline (per skill puzzle-game-engine):
 *  constructive placement -> derive true clue pools -> measured-greedy clue
 *  selection -> uniqueness proof (countSolutions maxCount=2, node budget,
 *  deadline retry) -> pad to one-clue-per-suspect -> weaken-minimize ->
 *  independent brute-force cross-check. Every puzzle REALLY solved for
 *  uniqueness; no constructive shortcuts.
 * ==========================================================================*/

const ROOM_NAMES = ['kitchen','study','bedroom','bathroom','living-room','dining-room','pantry','garage','attic','cellar','nursery','gallery','parlor','den','library','foyer','conservatory','laundry','sauna','observatory','greenhouse','gym','wine-cellar','music-room'];

/* ---------------- PRNG (mulberry32) ---------------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* ---------------- bitset helpers (BigInt masks, ≤64 cells) ---------------- */
const bit = (i) => 1n << BigInt(i);
function popcount(m) { let c = 0; while (m) { c += Number(m & 1n); m >>= 1n; } return c; }
function bits(m) {
  const out = []; let i = 0;
  while (m) { if (m & 1n) out.push(i); m >>= 1n; i++; }
  return out;
}
function binom(n, k) { let r = 1; for (let i = 0; i < k; i++) r = (r * (n - i)) / (i + 1); return r; }

/* ---------------- Layout: rooms + objects ---------------- */
function genLayout(N, rng, opt = {}) {
  const C = N * N;
  const minRooms = opt.minRooms ?? (N === 4 ? 3 : N === 6 ? 7 : 12);
  const numRooms = Math.max(minRooms, Math.round((C / (opt.roomArea ?? 3.8)) * (0.8 + rng() * 0.4)));
  const minArea = N === 4 ? 2 : 3;

  const cellRoom = new Int16Array(C).fill(-1);
  const rooms = [];
  const all = [...Array(C).keys()];
  shuffle(all, rng);
  for (let i = 0; i < numRooms; i++) { const c = all[i]; rooms.push({ cells: [c], name: '', id: i }); cellRoom[c] = i; }

  // smallest-room-first growth
  let remaining = C - numRooms;
  while (remaining > 0) {
    let ri = 0, minSz = Infinity;
    for (let r = 0; r < rooms.length; r++) {
      const sz = rooms[r].cells.length;
      if (sz < minSz) { minSz = sz; ri = r; }
      else if (sz === minSz && rng() < 0.3) ri = r;
    }
    const cands = [];
    for (const c of rooms[ri].cells) {
      const r = (c / N) | 0, cc = c % N;
      if (r > 0 && cellRoom[c - N] < 0) cands.push(c - N);
      if (r < N - 1 && cellRoom[c + N] < 0) cands.push(c + N);
      if (cc > 0 && cellRoom[c - 1] < 0) cands.push(c - 1);
      if (cc < N - 1 && cellRoom[c + 1] < 0) cands.push(c + 1);
    }
    if (!cands.length) { for (let i = 0; i < C; i++) if (cellRoom[i] < 0) { cands.push(i); break; } }
    const pick = cands[(rng() * cands.length) | 0];
    rooms[ri].cells.push(pick); cellRoom[pick] = ri; remaining--;
  }
  for (const room of rooms) if (room.cells.length < minArea) return null;

  const namePool = ROOM_NAMES.slice();
  shuffle(namePool, rng);
  rooms.forEach((room, i) => { room.name = namePool[i % namePool.length]; });

  // objects: blocker / rug / table
  const obj = new Uint8Array(C); // 0 plain, 1 blocker, 2 rug, 3 table
  for (const room of rooms) {
    const cells = room.cells.slice();
    shuffle(cells, rng);
    let stand = cells.length;
    const keep = cells.length >= 4 ? 3 : 2;
    for (const c of cells) {
      if (stand <= keep) break;
      if (rng() < (opt.blockerProb ?? 0.16)) { obj[c] = 1; stand--; }
    }
    for (const c of cells) { if (obj[c] === 1) continue; if (rng() < (opt.rugProb ?? 0.13)) obj[c] = 2; }
    for (const c of cells) { if (obj[c] !== 0) continue; if (rng() < (opt.tableProb ?? 0.13)) obj[c] = 3; }
  }
  // feasibility: every row / every column keeps >= 1 standable cell
  for (let r = 0; r < N; r++) { let s = 0; for (let c = 0; c < N; c++) if (obj[r * N + c] !== 1) s++; if (s === 0) return null; }
  for (let c = 0; c < N; c++) { let s = 0; for (let r = 0; r < N; r++) if (obj[r * N + c] !== 1) s++; if (s === 0) return null; }

  // derived masks
  const cellsInRoom = new Array(rooms.length).fill(0n);
  const roomOf = new Int16Array(C);
  let standMask = 0n, rugMask = 0n, tableMask = 0n, rugCount = 0, tableCount = 0;
  for (let i = 0; i < C; i++) {
    roomOf[i] = cellRoom[i];
    if (obj[i] !== 1) standMask |= bit(i);
    if (obj[i] === 2) { rugMask |= bit(i); rugCount++; }
    if (obj[i] === 3) { tableMask |= bit(i); tableCount++; }
    cellsInRoom[cellRoom[i]] |= bit(i);
  }
  const roomStand = rooms.map((room) => popcount(cellsInRoom[room.id] & standMask));

  let atTableMask = 0n, atTableCount = 0, wallMask = 0n, wallCount = 0, cornerMask = 0n, cornerCount = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const i = r * N + c;
    if (obj[i] === 1) continue;
    let wallDir = 0, tab = false;
    const nb = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (const [dr, dc] of nb) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= N || nc < 0 || nc >= N) { wallDir++; continue; }
      const ni = nr * N + nc;
      if (roomOf[ni] !== roomOf[i]) wallDir++;
      else if (obj[ni] === 3) tab = true;
    }
    if (tab) { atTableMask |= bit(i); atTableCount++; }
    if (wallDir >= 1) { wallMask |= bit(i); wallCount++; }
    if (wallDir >= 2) { cornerMask |= bit(i); cornerCount++; }
  }

  const rowMask = [], colMask = [];
  for (let r = 0; r < N; r++) { let m = 0n; for (let c = 0; c < N; c++) m |= bit(r * N + c); rowMask.push(m); }
  for (let c = 0; c < N; c++) { let m = 0n; for (let r = 0; r < N; r++) m |= bit(r * N + c); colMask.push(m); }

  return {
    N, C, rooms, cellRoom, roomOf, obj,
    cellsInRoom, roomStand, standMask, rugMask, tableMask, atTableMask, wallMask, cornerMask,
    rugCount, tableCount, atTableCount, wallCount, cornerCount, rowMask, colMask,
  };
}

/* ---------------- Placement: constructive Latin + victim rule ---------------- */
function cellSignature(lay, cell) {
  const N = lay.N;
  const r = (cell / N) | 0, c = cell % N;
  let wallDir = 0, tab = false;
  for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nr >= N || nc < 0 || nc >= N) { wallDir++; continue; }
    const ni = nr * N + nc;
    if (lay.roomOf[ni] !== lay.roomOf[cell]) wallDir++;
    else if (lay.obj[ni] === 3) tab = true;
  }
  return `${lay.obj[cell]}|${wallDir}|${tab ? 1 : 0}`;
}

function cellFeatures(lay, cell) {
  const N = lay.N;
  const r = (cell / N) | 0, c = cell % N;
  let wallDir = 0, tab = false;
  const rug = lay.obj[cell] === 2;
  for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nr >= N || nc < 0 || nc >= N) { wallDir++; continue; }

            for (let p = 0; p < N; p++) {
              if (p === s || p === t) continue;
              if (fixed[p] >= 0 && roomOf[fixed[p]] === R) fixInR++;
            }
            if (fixInR > 0) return;
            const m = cand[s] & cellsR;
            if (m !== cand[s]) { cand[s] = m; changed = true; }
            if (cand[s] === 0n) return;
            for (let p = 0; p < N; p++) {
              if (p === s || p === t || fixed[p] >= 0) continue;
              const nm = cand[p] & ~cellsR;
              if (nm !== cand[p]) { cand[p] = nm; changed = true; }
              if (nm === 0n) return;
            }
          }
        }
        for (const { R, k } of hasK) {
          const cellsR = cellsInRoom[R];
          if (k > roomStand[R]) return;
          let fx = 0, poss = 0;
          const possible = [];
          for (let p = 0; p < N; p++) {
            if (fixed[p] >= 0) { if (roomOf[fixed[p]] === R) fx++; }
            else if ((cand[p] & cellsR) !== 0n) { poss++; possible.push(p); }
          }
          if (fx > k) return;
          if (fx + poss < k) return;
          if (fx + poss === k) {
            for (const p of possible) {
              const m = cand[p] & cellsR;
              if (m !== cand[p]) { cand[p] = m; changed = true; }
            }
          } else if (fx === k) {
            for (const p of possible) {
              const nm = cand[p] & ~cellsR;
              if (nm !== cand[p]) { cand[p] = nm; changed = true; }
              if (nm === 0n) return;
            }
          }
        }
        {
          let Rv = -1;
          if (fixed[V] >= 0) Rv = roomOf[fixed[V]];
          else {
            const cv = cand[V];
            if (cv !== 0n) {
              for (let R = 0; R < lay.rooms.length; R++) {
                if ((cv & ~cellsInRoom[R]) === 0n) { Rv = R; break; }
              }
            }
          }
          if (Rv >= 0) {
            const cellsR = cellsInRoom[Rv];
            let fxS = 0, oneWho = -1;
            for (let p = 0; p < N - 1; p++) {
              if (fixed[p] >= 0 && roomOf[fixed[p]] === Rv) { fxS++; oneWho = p; }
            }
            if (fxS > 1) return;
            if (fxS === 1) {
              for (let p = 0; p < N; p++) {
                if (p === oneWho || p === V || fixed[p] >= 0) continue;
                const nm = cand[p] & ~cellsR;
                if (nm !== cand[p]) { cand[p] = nm; changed = true; }
                if (nm === 0n) return;
              }
            }
          }
        }
        if (!changed) break;
      }
      let allFixed = true;
      for (let p = 0; p < N; p++) if (fixed[p] < 0) { allFixed = false; break; }
      if (allFixed) {
        const Rv = roomOf[fixed[V]];
        let sInRv = 0;
        for (let p = 0; p < N - 1; p++) if (roomOf[fixed[p]] === Rv) sInRv++;
        if (sInRv !== 1) return;
        for (const { s, t } of sameRoom) if (roomOf[fixed[s]] !== roomOf[fixed[t]]) return;
        for (const { s, t } of onlyPair) {
          const R = roomOf[fixed[s]];
          let cnt = 0, hasT = false;
          for (let p = 0; p < N; p++) { if (roomOf[fixed[p]] === R) cnt++; if (p === t && roomOf[fixed[t]] === R) hasT = true; }
          if (cnt !== 2 || !hasT) return;
        }
        for (const { R, k } of hasK) {
          let cnt = 0;
          for (let p = 0; p < N; p++) if (roomOf[fixed[p]] === R) cnt++;
          if (cnt !== k) return;
        }
        sols.push(fixed.slice()); // copy: never leak the shared working buffer
        return;
      }
      let bp = -1, bc = Infinity;
      for (let p = 0; p < N; p++) {
        if (fixed[p] >= 0) continue;
        const pc = pcount(cand[p]);
        if (pc < bc) { bc = pc; bp = p; }
      }
      if (bp < 0) return;
      const cands = bits(cand[bp]);
      cands.sort((a, b) => roomStand[roomOf[a]] - roomStand[roomOf[b]] || a - b);
      const savedCand = cand.slice(), savedFixed = fixed.slice(), savedRU = rowUsed, savedCU = colUsed;
      for (const cell of cands) {
        for (let i = 0; i < N; i++) { cand[i] = savedCand[i]; fixed[i] = savedFixed[i]; }
        rowUsed = savedRU; colUsed = savedCU;
        fixed[bp] = cell; cand[bp] = bit(cell);
        const r = (cell / N) | 0, c = cell % N;
        rowUsed |= 1 << r; colUsed |= 1 << c;
        const kill = rowMask[r] | colMask[c];
        for (let q = 0; q < N; q++) if (q !== bp) cand[q] &= ~kill;
        search();
        if (sols.length >= maxCount) return;
      }
      for (let i = 0; i < N; i++) { cand[i] = savedCand[i]; fixed[i] = savedFixed[i]; }
    }

    search();
    return { sols, nodes };
  }
}

/* ---------------- independent full solution check ---------------- */
function checkSolution(N, lay, clues, personCell) {
  const seenR = new Set(), seenC = new Set();
  for (let p = 0; p < N; p++) {
    const cell = personCell[p];
    if (cell < 0 || cell >= lay.C) return false;
    if (!(lay.standMask & bit(cell))) return false;
    const r = (cell / N) | 0, c = cell % N;
    if (seenR.has(r) || seenC.has(c)) return false;
    seenR.add(r); seenC.add(c);
  }
  const RV = lay.roomOf[personCell[N - 1]];
  let cntV = 0;
  for (let p = 0; p < N; p++) if (lay.roomOf[personCell[p]] === RV) cntV++;
  if (cntV !== 2) return false;
  for (const cl of clues) {
    const s = cl.suspect, cs = personCell[s];
    switch (cl.type) {
      case 'loc_in': if (lay.roomOf[cs] !== cl.room) return false; break;
      case 'loc_not_in': if (lay.roomOf[cs] === cl.room) return false; break;
      case 'on_rug': if (lay.obj[cs] !== 2) return false; break;
      case 'at_table': if (!(lay.atTableMask & bit(cs))) return false; break;
      case 'at_wall': if (!(lay.wallMask & bit(cs))) return false; break;
      case 'in_corner': if (!(lay.cornerMask & bit(cs))) return false; break;
      case 'same_room': if (lay.roomOf[cs] !== lay.roomOf[personCell[cl.person]]) return false; break;
      case 'same_room_in':
        if (lay.roomOf[cs] !== cl.room || lay.roomOf[personCell[cl.person]] !== cl.room) return false;
        break;
      case 'only_me_and_x': {
        let cnt = 0;
        for (let p = 0; p < N; p++) if (lay.roomOf[personCell[p]] === lay.roomOf[cs]) cnt++;
        if (cnt !== 2 || lay.roomOf[personCell[cl.person]] !== lay.roomOf[cs]) return false;
        break;
      }
      case 'room_has_k': {
        let cnt = 0;
        for (let p = 0; p < N; p++) if (lay.roomOf[personCell[p]] === cl.room) cnt++;
        if (cnt !== cl.k) return false;
        break;
      }
      case 'room_empty': {
        for (let p = 0; p < N; p++) if (lay.roomOf[personCell[p]] === cl.room) return false;
        break;
      }
    }
  }
  return true;
}

/* ---------------- independent brute-force counter (plain backtracker) ---------------- */
function bruteCount(N, lay, clues, cap = 2, budget = 5e7) {
  let count = 0, nodes = 0;
  const ass = new Int32Array(N).fill(-1);
  function rec(p, rows, cols) {
    if (++nodes > budget) throw { budget: true, nodes };
    if (p === N) {
      if (checkSolution(N, lay, clues, ass)) count++;
      return count >= cap;
    }
    for (let r = 0; r < N; r++) {
      if (rows & (1 << r)) continue;
      for (let c = 0; c < N; c++) {
        if (cols & (1 << c)) continue;
        const cell = r * N + c;
        if (!(lay.standMask & bit(cell))) continue;
        ass[p] = cell;
        if (rec(p + 1, rows | (1 << r), cols | (1 << c))) return true;
      }
    }
    return false;
  }
  rec(0, 0, 0);
  return { count, nodes };
}

/* ---------------- wrappers ---------------- */
function solveCount(N, lay, clues, cap, budget = 3e6) {
  try { return new Solver(N, lay, clues).count(cap, budget).count; }
  catch (e) { if (e && e.budget) return -1; throw e; }
}
function solveCountNodes(N, lay, clues, cap, budget = 3e6) {
  const r = new Solver(N, lay, clues).count(cap, budget);
  return { count: r.count, nodes: r.nodes };
}

/* ---------------- repair local search (greedy stall fallback) ---------------- */
function repairSearch(N, lay, pools, cur, cnt, rng) {
  let best = null;
  let budget = 600;
  const greedyCap = N <= 4 ? 300 : N <= 6 ? 150 : 80;
  const suspects = [...Array(N - 1).keys()];
  shuffle(suspects, rng);
  for (const s of suspects) {
    const hasClue = cur.some((c) => c.suspect === s);
    let tried = 0;
    for (const clue of pools[s]) {
      if (budget-- <= 0) break;
      if (tried++ >= 8) break;
      const test = hasClue ? cur.map((c) => (c.suspect === s ? clue : c)) : cur.concat(clue);
      const c2 = solveCount(N, lay, test, greedyCap);
      if (c2 === 1) return { clues: test, cnt: 1, changed: true };
      if (c2 !== -1 && (!best || c2 < best.c2)) best = { clues: test, cnt: c2, changed: true };
    }
    if (budget <= 0) break;
  }
  if (best && best.cnt < cnt) return best;
  return null;
}

/* ---------------- full puzzle generation ---------------- */
function generatePuzzle(N, seed, opt = {}) {
  const rng = mulberry32(seed);
  const maxAttempts = opt.maxAttempts ?? (N === 4 ? 150 : N === 6 ? 120 : 80);
  const proofBudget = opt.proofBudget ?? 6e6;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    const lay = genLayout(N, rng, opt);
    if (!lay) continue;
    const pl = genPlacement(N, lay, rng);
    if (!pl) continue;
    const pools = derivePools(N, lay, pl, opt);

    // ---- ceiling gate: the FUSED clue set must be unique, else this attempt can
    // never converge (structural ambiguity). Cheap single solve per attempt. ----
    const fusedAll = [];
    for (const pool of pools) for (const cl of pool) fusedAll.push(cl);
    let fused;
    try { fused = solveCountNodes(N, lay, fusedAll, 2, proofBudget); }
    catch (e) { if (e && e.budget) continue; throw e; }
    if (fused.count !== 1) continue;

    // ---- dig-out: delete clues from the unique fused set while uniqueness holds ----
    let cur = fusedAll.slice();
    const delIdx = [...cur.keys()];
    shuffle(delIdx, rng);
    for (const i of delIdx) {
      const test = cur.filter((_, j) => j !== i);
      let c;
      try { c = solveCountNodes(N, lay, test, 2, proofBudget).count; }
      catch (e) { if (e && e.budget) continue; throw e; }
      if (c === 1) cur = test;
    }
    const M = cur.length;

    // ---- one-clue-per-suspect search: step-down descent + diff-guided last mile ----
    let assignment = null;
    {
      // stratified pool: discriminating personal types first, then score order
      const poolView = pools.map((p) => {
        const personal = ['on_rug', 'at_table', 'at_wall', 'in_corner', 'same_room', 'same_room_in', 'only_me_and_x'];
        const had = new Set();
        const extra = [];
        for (const cl of p) {
          if (personal.includes(cl.type) && !had.has(cl.type)) { had.add(cl.type); extra.push(cl); }
        }
        return extra.concat(p.slice(0, Math.max(0, 14 - extra.length)));
      });
      const restarts = N <= 4 ? 8 : N <= 6 ? 6 : 6;
      const searchCap = 8;
      let usedCounts = 0;
      const capCounts = N <= 6 ? 700 : 500;
      let curCount = searchCap;
      const countSafe = (set) => {
        if (usedCounts++ > capCounts) return -2;
        const r = solveCount(N, lay, set, searchCap, N >= 8 ? Math.min(proofBudget, 1e6) : proofBudget);
        // node-budget overrun: candidate is near-unique; skip it without aborting the descent
        return r === -1 ? curCount : r;
      };
      const hardVerify = (set) => solveCount(N, lay, set, 2, proofBudget) === 1 && checkSolution(N, lay, set, pl.personCell);
      for (let r = 0; r < restarts && !assignment; r++) {
        let curSet = [];
        for (let s = 0; s < N - 1; s++) {
          const pv = poolView[s];
          const cl = pv[(rng() * pv.length) | 0];
          if (!cl) break;
          curSet.push(cl);
        }
        if (curSet.length !== N - 1) continue;
        curCount = countSafe(curSet);
        if (curCount === -2) break;
        // step-down descent (count 8 -> ... -> 2)
        for (let pass = 0; pass < 8 && curCount > 1; pass++) {
          let improved = false;
          const order = [...Array(N - 1).keys()];
          shuffle(order, rng);
          for (const s of order) {
            const cands = poolView[s].slice();
            shuffle(cands, rng);
            for (const clue of cands) {
              const test = curSet.map((c) => (c.suspect === s ? clue : c));
              const c2 = countSafe(test);
              if (c2 === -2) { improved = false; break; }
              if (c2 < curCount) {
                curSet = test; curCount = c2; improved = true;
                if (curCount === 1) break;
                break; // first improvement -> next pass
              }
            }
            if (curCount === 1 || !improved) break;
          }
          if (curCount === 1) break;
          if (!improved) break; // local minimum
        }
        if (curCount === 1) {
          if (hardVerify(curSet)) assignment = curSet;
          continue;
        }
        if (curCount === 2) {
          // diff-guided last mile: collapse the solution pair directly
          let res;
          try { res = new Solver(N, lay, curSet).countSolutions(2, Math.min(proofBudget, 4e6)); }
          catch (e) { if (e && e.budget) continue; throw e; }
          if (res.sols.length === 1) { if (hardVerify(curSet)) assignment = curSet; continue; }
          if (res.sols.length >= 2) {
            const [s1, s2] = res.sols;
            const diff = [];
            for (let p = 0; p < N - 1; p++) if (s1[p] !== s2[p]) diff.push(p);
            const order = diff.slice();
            shuffle(order, rng);
            let won = false, stuck = false;
            for (const s of order) {
              const cands = poolView[s].slice();
              shuffle(cands, rng);
              for (const clue of cands) {
                const test = curSet.map((c) => (c.suspect === s ? clue : c));
                const rr = countSafe(test);
                if (rr === -2) { stuck = true; break; }
                if (rr === 1 && hardVerify(test)) { curSet = test; won = true; break; }
              }
              if (won || stuck) break;
            }
            if (won && hardVerify(curSet)) assignment = curSet;
          }
        }
      }
    }
    if (!assignment) continue;
    cur = assignment;

    // ---- weaken-minimize (replace with weaker true clues while unique) ----
    const idsInOrder = [...new Set(cur.map((c) => c.suspect))];
    shuffle(idsInOrder, rng);
    for (const s of idsInOrder) {
      const curClue = cur.find((c) => c.suspect === s);
      for (const alt of pools[s]) {
        if (alt === curClue || alt.score >= curClue.score) continue;
        const test = cur.map((c) => (c.suspect === s ? alt : c));
        if (solveCount(N, lay, test, 2, proofBudget) === 1) { cur = test; break; }
      }
    }

    // ---- metric: fully-minimized clue count (drop any removable clue) ----
    let mini = cur.slice();
    {
      const idxs = [...mini.keys()];
      shuffle(idxs, rng);
      for (const i of idxs) {
        const test = mini.filter((_, j) => j !== i);
        if (solveCount(N, lay, test, 2, proofBudget) === 1) mini = test;
      }
    }
    const m2 = mini.length;

    // ---- final verification ----
    const v1 = solveCount(N, lay, cur, 2, proofBudget);
    if (v1 !== 1) continue;
    if (!checkSolution(N, lay, cur, pl.personCell)) throw new Error(`seed=${seed} attempt=${attempt}: clue not true of placement`);
    let brute;
    try { brute = bruteCount(N, lay, cur, 2, N >= 8 ? 2e6 : 5e7); }
    catch (e) { if (e && e.budget) brute = { count: -2, nodes: e.nodes }; else throw e; }
    if (brute.count !== 1 && brute.count !== -2) throw new Error(`seed=${seed}: solver says unique (${v1}) but brute found ${brute.count}`);

    return {
      N, seed, attempt, layout: lay, clues: cur, placement: pl, M, m2,
      fusedNodes: fused.nodes, brute,
    };
  }
  return null;
}

<script>
const E = window.MurdokuEngine;
const SUSPECT_NAMES = ["Mochi", "Tofu", "Pixel", "Biscuit", "Nimbus"];
const VICTIM = "Old Whiskers";
let puzzle = null, N = 4, placed = [], selSuspect = 0, caseNo = 1, hintsUsed = 0, startTs = 0;

// 24 个引擎房间名 → 8 种地板纹理
const ROOM_TEX = {
  "kitchen": "floor-kitchen", "dining-room": "floor-kitchen", "pantry": "floor-kitchen", "laundry": "floor-kitchen",
  "study": "floor-hardwood", "library": "floor-hardwood", "gallery": "floor-hardwood", "observatory": "floor-hardwood", "foyer": "floor-hardwood",
  "bedroom": "floor-carpet", "nursery": "floor-carpet", "parlor": "floor-carpet", "den": "floor-carpet", "living-room": "floor-carpet",
  "bathroom": "floor-marble", "sauna": "floor-marble",
  "cellar": "floor-stone", "wine-cellar": "floor-stone", "garage": "floor-stone",
  "attic": "floor-attic", "music-room": "floor-attic",
  "conservatory": "floor-greenhouse", "greenhouse": "floor-greenhouse",
  "gym": "floor-gym"
};
const TINTS = ["rgba(217,119,6,.10)", "rgba(142,108,74,.10)", "rgba(180,98,78,.10)", "rgba(120,132,90,.10)", "rgba(150,120,150,.10)", "rgba(90,130,140,.10)"];

// --- 矢量道具（水彩绘本版：软边、低不透明度、虚线纹） ---
const SVG_CRATE = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="6" width="52" height="52" rx="10" fill="#B98D5F" opacity=".85"/><rect x="13" y="13" width="38" height="9" rx="4.5" fill="#8A6238" opacity=".5"/><rect x="13" y="27" width="38" height="9" rx="4.5" fill="#8A6238" opacity=".5"/><rect x="13" y="41" width="38" height="9" rx="4.5" fill="#8A6238" opacity=".5"/><rect x="28" y="6" width="8" height="52" fill="#8A6238" opacity=".3"/></svg>`;
const SVG_RUG = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><ellipse cx="32" cy="32" rx="28" ry="22" fill="#D98E7E" opacity=".75"/><ellipse cx="32" cy="32" rx="21" ry="15.5" fill="#F2D5BC" opacity=".8"/><ellipse cx="32" cy="32" rx="13" ry="9.5" fill="#D98E7E" opacity=".8"/><ellipse cx="32" cy="32" rx="6" ry="4.5" fill="#B45309" opacity=".6"/><g stroke="#B45309" stroke-width="1.4" stroke-linecap="round" opacity=".45" stroke-dasharray="3 4"><line x1="3" y1="26" x2="3" y2="38"/><line x1="61" y1="26" x2="61" y2="38"/></g></svg>`;
const SVG_TABLE = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="33" cy="35" r="24" fill="#8A6238" opacity=".22"/><circle cx="32" cy="31" r="24" fill="#C9A87C" opacity=".9"/><circle cx="32" cy="31" r="18" fill="none" stroke="#A98B62" stroke-width="1.4" opacity=".6" stroke-dasharray="5 6"/><circle cx="32" cy="31" r="5" fill="#A98B62" opacity=".7"/></svg>`;

const titleCase = s => s.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
const roomName = i => titleCase(puzzle.layout.rooms[i].name);
const suspectName = i => SUSPECT_NAMES[i];
const rowCol = c => `row ${Math.floor(c / N) + 1}, column ${c % N + 1}`;
const catImg = (name, cls) => `<img class="${cls || "cav"}" src="${ASSETS["cat-" + name] || ""}" alt="${name}">`;

function clueText(cl) {
  const av = cl.suspect != null ? catImg(suspectName(cl.suspect)) : "";
  const S = `<b>${cl.suspect != null ? suspectName(cl.suspect) : ""}</b>`;
  const R = cl.room != null ? roomName(cl.room) : "";
  const PN = p => p != null ? (p < N - 1 ? suspectName(p) : VICTIM) : "";
  switch (cl.type) {
    case "loc_in": return `${av}${S} was in the <b>${R}</b>.`;
    case "loc_not_in": return `${av}${S} was <span class="neg">NOT</span> in the <b>${R}</b>.`;
    case "on_rug": return `${av}${S} was standing on a rug.`;
    case "at_table": return `${av}${S} was beside a table.`;
    case "at_wall": return `${av}${S} was at a wall.`;
    case "in_corner": return `${av}${S} was in a corner.`;
    case "same_room": return `${av}${S} was in the same room as <b>${PN(cl.person)}</b>.`;
    case "same_room_in": return `${av}${S} was with <b>${PN(cl.person)}</b> in the <b>${R}</b>.`;
    case "only_me_and_x": return `${av}${S} was alone with <b>${PN(cl.person)}</b>.`;
    case "room_has_k": return `Exactly <b>${cl.k}</b> figure${cl.k > 1 ? "s" : ""} (victim included) were in the <b>${R}</b>.`;
    case "room_empty": return `The <b>${R}</b> was locked — nobody inside.`;
    default: return `${av}${S}: ${cl.type}`;
  }
}

function newCase(size) {
  N = size; selSuspect = 0; hintsUsed = 0; startTs = Date.now();
  document.getElementById("hintbox").textContent = "";
  document.getElementById("caseChip").textContent = `CASE №${caseNo} · ${N}×${N}`;
  document.getElementById("d4").classList.toggle("on", N === 4);
  document.getElementById("d6").classList.toggle("on", N === 6);
  const board = document.getElementById("board");
  board.innerHTML = `<div class="loading">Generating a fair case…</div>`;
  setTimeout(() => {
    let p = null, seed = Math.floor(Math.random() * 1e9);
    for (let i = 0; i < 40 && !p; i++) { try { p = E.generatePuzzle(N, seed + i * 7919); } catch (e) {} }
    if (!p) { board.innerHTML = `<div class="loading">Generation failed — try New Case</div>`; return; }
    puzzle = p;
    placed = new Array(N - 1).fill(-1);
    renderAll();
  }, 30);
}

function renderAll() { renderBoard(); renderClues(); }

function renderBoard() {
  const lay = puzzle.layout, board = document.getElementById("board");
  board.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  board.innerHTML = "";
  const texIdx = {};
  lay.rooms.forEach((r, i) => {
    texIdx[r.id] = { tex: ASSETS[ROOM_TEX[r.name] || "floor-hardwood"], tint: TINTS[i % TINTS.length] };
  });
  const seen = new Set();
  const victimCell = puzzle.placement.personCell[N - 1];
  for (let c = 0; c < lay.C; c++) {
    const div = document.createElement("div");
    div.className = "cell"; div.dataset.idx = c;
    const room = lay.cellRoom[c], t = texIdx[room];
    div.style.backgroundImage = `url("${t.tex}")`;
    div.style.backgroundSize = N === 4 ? "56px" : "44px";
    div.innerHTML = `<span class="tint" style="background:${t.tint}"></span>`;
    if (!seen.has(room)) { seen.add(room); div.innerHTML += `<span class="rlabel">${roomName(room)}</span>`; }
    const o = lay.obj[c];
    if (o === 1) div.innerHTML += `<span class="prop">${SVG_CRATE}</span>`;
    if (o === 2) div.innerHTML += `<span class="prop">${SVG_RUG}</span>`;
    if (o === 3) div.innerHTML += `<span class="prop">${SVG_TABLE}</span>`;
    if (c === victimCell) {
      div.classList.add("victim");
      div.innerHTML += `<img class="fig" src="${ASSETS["cat-victim"]}" alt="${VICTIM}"><span class="vbadge">V</span>`;
      div.title = VICTIM + " (the victim)";
    }
    const si = placed.indexOf(c);
    if (si >= 0) { div.innerHTML += `<img class="fig" src="${ASSETS["cat-" + suspectName(si).toLowerCase()]}" alt="">`; if (si === selSuspect) div.classList.add("placed-sel"); }
    if (selSuspect >= 0 && placed[selSuspect] < 0 && o !== 1 && c !== victimCell) div.classList.add("sel-target");
    div.addEventListener("click", () => onCell(c));
    board.appendChild(div);
  }
  renderSuspects();
}

function renderClues() {
  const el = document.getElementById("clueList");
  el.innerHTML = "";
  for (const cl of puzzle.clues) {
    const d = document.createElement("div");
    d.className = "clue";
    d.innerHTML = clueText(cl);
    el.appendChild(d);
  }
}

function renderSuspects() {
  const el = document.getElementById("suspects");
  el.innerHTML = "";
  for (let s = 0; s < N - 1; s++) {
    const b = document.createElement("button");
    b.className = "suss" + (s === selSuspect ? " sel" : "") + (placed[s] >= 0 ? " done" : "");
    b.innerHTML = `<img src="${ASSETS["cat-" + suspectName(s).toLowerCase()]}" alt="${suspectName(s)}"><span class="sn">${suspectName(s)}</span>`;
    b.addEventListener("click", () => { selSuspect = s; renderBoard(); });
    el.appendChild(b);
  }
}

function onCell(c) {
  const lay = puzzle.layout;
  const victimCell = puzzle.placement.personCell[N - 1];
  const cur = placed.indexOf(c);
  if (cur >= 0) { placed[cur] = -1; selSuspect = cur; renderBoard(); return; }
  if (lay.obj[c] === 1 || c === victimCell) { flashCell(c, "bad-flash"); return; }
  if (selSuspect >= 0 && placed[selSuspect] < 0) {
    const occ = [...placed.filter(x => x >= 0), victimCell];
    const conflict = occ.some(x => x >= 0 && (Math.floor(x / N) === Math.floor(c / N) || x % N === c % N));
    if (conflict) { flashCell(c, "bad-flash"); setHint("The sudoku rule: no two figures share a row or column!", true); return; }
    placed[selSuspect] = c;
    if (placed.every(x => x >= 0)) checkWin(true);
    else { const nxt = placed.findIndex(x => x < 0); selSuspect = nxt; renderBoard(); }
  }
}

function flashCell(c, cls) {
  const el = document.querySelector(`.cell[data-idx="${c}"]`);
  if (el) { el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 800); }
}
function setHint(t, err) { const h = document.getElementById("hintbox"); h.textContent = t; h.classList.toggle("err", !!err); }

function checkWin(auto) {
  const full = [...placed, puzzle.placement.personCell[N - 1]];
  const ok = placed.every(x => x >= 0) && E.checkSolution(N, puzzle.layout, puzzle.clues, full);
  if (ok) {
    const k = puzzle.placement.killer, kr = puzzle.layout.cellRoom[puzzle.placement.personCell[N - 1]];
    const secs = Math.round((Date.now() - startTs) / 1000);
    document.getElementById("culpritImg").src = ASSETS["cat-" + suspectName(k).toLowerCase()];
    document.getElementById("culpritImg").alt = suspectName(k);
    document.getElementById("winText").innerHTML =
      `<span class="culprit">${suspectName(k)}</span> was alone with ${VICTIM} in the <b>${roomName(kr)}</b>.<br>` +
      `Solved in ${secs}s · ${hintsUsed} hint${hintsUsed === 1 ? "" : "s"}`;
    document.getElementById("winOverlay").classList.add("show");
  } else if (!auto) {
    setHint("Not quite — statements or the sudoku rule are violated. Recheck!", true);
    placed.forEach((c, i) => { if (c >= 0) flashCell(c, "bad-flash"); });
  }
}

document.getElementById("hintBtn").addEventListener("click", () => {
  if (!puzzle) return;
  let s = placed[selSuspect] < 0 ? selSuspect : placed.findIndex(x => x < 0);
  if (s < 0) { setHint("Everyone is placed — hit Accuse!", false); return; }
  const target = puzzle.placement.personCell[s];
  hintsUsed++;
  const el = document.querySelector(`.cell[data-idx="${target}"]`);
  if (el) { el.classList.add("hint-flash"); setTimeout(() => el.classList.remove("hint-flash"), 1700); }
  setHint(`${suspectName(s)} goes at ${rowCol(target)} (${roomName(puzzle.layout.cellRoom[target])}).`);
});

document.getElementById("checkBtn").addEventListener("click", () => checkWin(false));
document.getElementById("newBtn").addEventListener("click", () => { caseNo++; newCase(N); });
document.getElementById("againBtn").addEventListener("click", () => { caseNo++; document.getElementById("winOverlay").classList.remove("show"); newCase(N); });
document.getElementById("d4").addEventListener("click", () => newCase(4));
document.getElementById("d6").addEventListener("click", () => newCase(6));
["shCopy", "shX", "shReddit"].forEach(id => document.getElementById(id).addEventListener("click", () => {
  const k = puzzle ? suspectName(puzzle.placement.killer) : "?";
  setHint(`[preview] share_${id} → case closed, killer = ${k} (production: 复制文案/跳转)`);
}));

newCase(4);
</script>
</body>
</html>
