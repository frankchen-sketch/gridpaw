name = "gridpaw"
compatibility_date = "2026-06-01"
pages_build_output_dir = "dist"

[vars]
# 自建漏斗事件采集开关（只在这一处定义 —— 同名变量双处定义会互相压，坑 #3）
FUNNEL_EVENT_INGESTION_ENABLED = "true"
# 去广告一次性商品（金额/币种/tax code 唯一真源；secret 走 wrangler pages secret put）
ADFREE_PRICE_CENTS = "499"
ADFREE_CURRENCY = "usd"
ADFREE_TAX_CODE = "txcd_10000000"
ADFREE_PRODUCT_LABEL = "GridPaw Ad-Free (lifetime)"

[[d1_databases]]
binding = "meowtrail_users"
database_name = "meowtrail-users"
database_id = "80cc8484-7f17-43a0-96aa-14809d953c26"

